<header class="site-header">
  <nav class="container nav-shell" aria-label="Navegação principal">
    <a href="#inicio" class="brand" aria-label="Lucas Physique — início" (click)="close()">
      @if (media.logo) {
        <img class="brand-logo" [src]="media.logo" width="480" height="542" alt="" />
      } @else {
        <span class="brand-symbol" aria-hidden="true">L<span>P</span></span>
      }
      <span>LUCAS <strong>PHYSIQUE</strong><small>CONSULTORIA ONLINE</small></span>
    </a>
    <button
      #toggle
      class="menu-toggle"
      type="button"
      [attr.aria-expanded]="open()"
      aria-controls="main-menu"
      [attr.aria-label]="open() ? 'Fechar menu' : 'Abrir menu'"
      (click)="open.set(!open())"
      (keydown.escape)="closeAndFocus(toggle)"
    >
      {{ open() ? 'Fechar ×' : 'Menu ☰' }}
    </button>
    <div
      id="main-menu"
      class="nav-links"
      [class.is-open]="open()"
      (keydown.escape)="closeAndFocus(toggle)"
    >
      <a href="#inicio" (click)="close()">Início</a>
      <a href="#sobre" (click)="close()">Sobre o Lucas</a>
      <a href="#metodo" (click)="close()">Método 360</a>
      <a href="#planos" class="button button-small" (click)="close()"
        >Escolha seu plano <span aria-hidden="true">↗</span></a
      >
    </div>
  </nav>
</header>
