<!-- Modal -->
<div
  class="modal modal-xl fade"
  id="projetoModal"
  tabindex="-1"
  aria-labelledby="projetoModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="projetoModalLabel">{{ projeto()?.titulo }}</h1>
        <button
          (click)="modalFechado.emit()"
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body">
        <img
          [src]="projeto()?.urlImagem"
          alt="{{ projeto()?.titulo }}"
          class="img-fluid rounded"
        />
      </div>
    </div>
  </div>
</div>
